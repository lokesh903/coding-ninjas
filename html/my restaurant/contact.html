<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Website</title>
</head>
<body>
   <!-- Navigation Menu (Accessible on all pages) -->
   <nav>
    <!-- Add a welcome heading -->
     <h1>Welcome to Restaurant</h1>
    <!-- Add links to Home, Dishes, and Contact Us pages -->
     <ul style="display: flex; gap:10px">
        <li type="none"><a href="home.html">Home</a></li>
        <li type="none"><a href="dishes.html">Dishes</a></li>
        <li type="none"><a href="contact.html">Contact Us</a></li>
     </ul>
    </nav>

    <!-- Contact Us Page (contact.html) -->
    <section id="contact">
        <h1>Contact Us</h1>
        <h3>For inquiries, you can reach us via email or phone</h3>
        <p><b>Email:</b> Demo@gmail.com</p>
        <p><b>Phone:</b> 1234567890</p>
        
        <div style=" padding:10px;">
            
            <form>
                <form>
                    <fieldset>
                        <legend>Feedback Form</legend>
                        <div>
                            <label for="#username">Username</label><br>
                            <input type="text" id="username" required name="username">
                        </div>
                        
                        <div>
                            <label for="#mail">E-mail</label><br>
                            <input type="email" id="mail" required placeholder="abc@example.com" name="email">
                        </div>
                        <div>
                            <label for="#feedback">FeedBack</label><br>
                            <textarea name="feedback" id="feedback" cols="10" rows="3" placeholder="feedback"></textarea>
                        </div>
                        
                        <div>
                            <input type="submit">
                        </div>
                    </fieldset>
                    
                </form>
            </form>
        </div>
    </section>
</body>
